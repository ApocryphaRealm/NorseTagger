; NorseTagger settings. The rules go in the tags folder beside this file (see tags\README.txt).
[General]
; 0 trace, 1 debug (one line per tag given), 2 info (a summary per rule), 3 warn, 4 error
uLogLevel=2
; tag at each map load (the game reloads assets between maps)
bApplyOnMapLoad=1
; where NorseTagger.log is written; empty = this folder
sLogDir=
